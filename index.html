        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;">

                <div id="flipCard" class="flip-card">

    <script>
        // Select the elements
        const comicLink = document.getElementById('comic-link');
        const flipCard = document.getElementById('flipCard');

        // Intercept the contextmenu (right-click) event
        comicLink.addEventListener('contextmenu', function(event) {
            // 1. Stop the browser's standard right-click menu from opening
            event.preventDefault();
            
            // 2. Toggle the CSS class to trigger the smooth 3D flip
            flipCard.classList.toggle('flipped');
        });
    </script>
